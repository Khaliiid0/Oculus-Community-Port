modLoader="javafml"
loaderVersion="[65.1,66)"
license="LGPL-3.0-only"
issueTrackerURL="https://github.com/Khaliiid0/Oculus-Community-Port/issues"
clientSideOnly=true

[[mods]]
modId="oculus"
version="${mod_version}"
displayName="Oculus Forge 26.2 Community Port"
displayURL="https://github.com/Khaliiid0/Oculus-Community-Port"
logoFile="oculus-logo.png"
authors="Original Oculus and Iris contributors; unofficial Forge 26.2 community port contributors"
description='''Unofficial community port of the LGPL-3.0 Oculus/Iris shader-pack loader to Minecraft Forge 26.2.
This build is not an official Oculus, Iris, Forge, Sodium, Embeddium, or Mojang release.
Renderer Milestone beta: compatible deferred/composite/final stages render through Forge's frame graph.
Shader-only switching is asynchronous and transactional; independent color buffers, generated noise and bounded pack-local PNG textures are supported.
Experimental terrain MRTs, bounded history, native terrain/shadow programs and static specular maps are implemented.
Extended chunk attributes and HDR scene capture require explicit restart-only experimental JVM flags; both are disabled by default.
This is not a complete world renderer. Entity, particle, hand, sky/cloud/weather, full materials and transparency integration remain incomplete.
BSL and Complementary have partial experimental rendering tests, not complete visual compatibility or measured FPS gains. Minecraft 1.21.11 renderer parity is not included.
OptiFine is unsupported and incompatible.'''

[[dependencies.oculus]]
    modId="forge"
    mandatory=true
    versionRange="[65.1.0,66)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.oculus]]
    modId="minecraft"
    mandatory=true
    versionRange="[26.2,26.3)"
    ordering="NONE"
    side="CLIENT"
