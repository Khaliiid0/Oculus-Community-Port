uniform.float.declaredPhase=worldTime / 24000
variable.float.fadeOutA=clamp((worldTime - 12330) / 230, 0.0, 1.0)
variable.float.fadeInA=clamp((worldTime - 13010) / 220, 0.0, 1.0)
variable.float.fadeOutB=clamp((worldTime - 22770) / 220, 0.0, 1.0)
variable.float.fadeInB=clamp((worldTime - 23440) / 230, 0.0, 1.0)
uniform.float.declaredFade=1.0 - (fadeOutA - fadeInA + fadeOutB - fadeInB)
uniform.float.declaredBrightness=max(sin(declaredPhase * 6.28318530718), 0.0)
